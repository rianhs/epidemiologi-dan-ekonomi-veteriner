project:
  type: website
  output-dir: _site
  resources:
    - "slides/*.html"
    - "assets/fonts/*"

website:
  title: "Epidemiologi dan Ekonomi Veteriner"
  site-url: https://rianhs.github.io/epidemiologi-dan-ekonomi-veteriner/
  repo-url: https://github.com/rianhs/epidemiologi-dan-ekonomi-veteriner
  search: true
  navbar:
    left:
      - text: Bahan ajar
        menu:
          - href: slides/index.md
            text: Bahan tayang
          - href: encyclopedia/index.md
            text: Ensiklopedia
          - href: guides/index.md
            text: Panduan
      - href: skills.md
        text: Peta subkompetensi
  page-footer:
    left: "Epidemiologi dan Ekonomi Veteriner, Universitas Hasanuddin"
    right: "Situs web ini dibuat dengan ♡️ oleh RianHS."

format:
  html:
    theme:
      light: [default, theme-light.scss, theme.scss]
      dark: [default, theme-dark.scss, theme.scss]
    respect-user-color-scheme: true
    lang: id
    toc: true
    toc-location: left
    toc-depth: 3
    toc-title: Daftar isi
    smooth-scroll: true
    include-after-body: toc-toggle.html
